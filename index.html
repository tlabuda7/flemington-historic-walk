<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flemington Main Street, c. 1920</title>

  <!-- A-Frame (WebXR framework), loaded from its official CDN. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- Our own code: shared components, the building kit, and the modelled landmarks. -->
  <script src="js/components.js"></script>
  <script src="js/kit.js"></script>
  <script src="js/landmarks.js"></script>

  <style>
    /* On-screen help for desktop. Not visible inside the headset. */
    #help {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      padding: 10px 14px; max-width: 280px;
      font: 13px/1.45 Georgia, serif; color: #f4ead8;
      background: rgba(40, 28, 18, 0.72); border-radius: 6px;
      pointer-events: none;
    }
    #help b { color: #fff; }
  </style>
</head>
<body>
  <div id="help">
    <b>Flemington Main Street, c. 1920</b><br>
    Click the scene to look with the mouse (Esc to release).<br>
    W A S D / arrows to walk, Shift to walk faster.<br>
    In VR: left stick walks (hold left trigger to walk faster), right stick snap-turns.
  </div>

  <!--
    SCENE SETUP
    - renderer: antialiasing on; foveation lowers detail at the lens edges on Quest.
    - fog: warm exponential haze; colour matches the sky's horizon colour.
  -->
  <a-scene
    renderer="antialias: true; foveationLevel: 1"
    fog="type: exponential; color: #ecdfc4; density: 0.011">

    <!-- ============================================================
         SKY AND LIGHT
         ============================================================ -->

    <!-- Sky: a large inward-facing sphere with a gradient. Fog is turned off for it. -->
    <a-entity id="sky"
      geometry="primitive: sphere; radius: 400; segmentsWidth: 24; segmentsHeight: 16"
      material="shader: flat; side: back; fog: false"
      gradient-sky="top: #a9bfd2; horizon: #ecdfc4"></a-entity>

    <!-- Soft fill light: warm from above, brown bounce from the ground. -->
    <a-entity light="type: hemisphere; color: #fff0d4; groundColor: #7a5f45; intensity: 1.3"></a-entity>
    <!-- Low, warm afternoon sun from the south-west. No shadows (expensive on Quest). -->
    <a-entity light="type: directional; color: #ffd9a3; intensity: 1.8" position="-40 35 25"></a-entity>

    <!-- ============================================================
         LAYOUT (from the 1921 Sanborn map, sheets 2 and 3)
         1 scene unit = 1 metre. Main Street runs north-south along Z (north = -Z).
         z = 0 is the north side of Court Street.
         Main Street is 66 ft (20.6 m) between property lines: x = -10.3 to +10.3.
           Road:       x = -6.4 to 6.4
           Sidewalks:  x = ±6.4 to ±10.3
         Cross streets: Bloomfield Ave (east, z -89.8 to -77.6), Court St (west, z 0 to 12.2).
         ============================================================ -->

    <!-- Ground beyond the street (yards, lots). -->
    <a-plane id="ground" rotation="-90 0 0" width="500" height="500"
      material="color: #6f6a45; roughness: 1"></a-plane>

    <!-- Paved roads: pale weathered macadam, as in the 1920s postcards.
         Texture tiles every 3 m (repeat = size / 3). -->
    <a-plane id="road" rotation="-90 0 0" position="0 0.01 -50" width="12.8" height="260"
      material="src: assets/textures/polyhaven/road_macadam.jpg; repeat: 4.3 87; roughness: 1"></a-plane>
    <a-plane id="bloomfield-ave" rotation="-90 0 0" position="35.15 0.01 -83.7" width="50" height="12.2"
      material="src: assets/textures/polyhaven/road_macadam.jpg; repeat: 16.7 4; roughness: 1"></a-plane>
    <a-plane id="court-st" rotation="-90 0 0" position="-35.15 0.01 6.1" width="50" height="12.2"
      material="src: assets/textures/polyhaven/road_macadam.jpg; repeat: 16.7 4; roughness: 1"></a-plane>

    <!-- Concrete sidewalks (15 cm high, scored into 1.5 m slabs) with stone curbs. -->
    <a-box id="sidewalk-west" position="-8.35 0.075 -50" width="3.9" height="0.15" depth="260"
      material="src: assets/textures/polyhaven/sidewalk_concrete.jpg; repeat: 1.3 87; roughness: 1"></a-box>
    <a-box id="sidewalk-east" position="8.35 0.075 -50" width="3.9" height="0.15" depth="260"
      material="src: assets/textures/polyhaven/sidewalk_concrete.jpg; repeat: 1.3 87; roughness: 1"></a-box>
    <a-box id="curb-west" position="-6.52 0.08 -50" width="0.24" height="0.16" depth="260"
      material="color: #a49d92; roughness: 1"></a-box>
    <a-box id="curb-east" position="6.52 0.08 -50" width="0.24" height="0.16" depth="260"
      material="color: #a49d92; roughness: 1"></a-box>

    <!-- Lawns in front of the set-back buildings on the west side, with front paths. -->
    <a-plane id="lawn-west" rotation="-90 0 0" position="-27.65 0.015 -38.7" width="34.7" height="77.4"
      material="color: #6f8048; roughness: 1"></a-plane>
    <!-- (The courthouse has a paved forecourt instead: see #courthouse-grounds.) -->
    <!-- All front paths are one mesh (one draw call): "x z width depth" per path.
         County Offices: three 1.6 m walks from the sidewalk to its three stoops (they run
         0.1 m under the stoop feet at x -15.3 so no gap shows). Then 65 Main (1.3 m walk from
         the sidewalk to under its porch steps) and the
         Wurts law office (1.2 m walk from the sidewalk to 0.1 m under its front step). -->
    <a-entity id="paths" ground-patches="y: 0.03; color: #b9b0a0;
      rects: -12.85 -24.07 5.1 1.6, -12.85 -27.87 5.1 1.6, -12.85 -31.67 5.1 1.6,
             -12.63 -51.19 4.75 1.3, -12.5 -68.69 4.5 1.2"></a-entity>

    <!-- ============================================================
         STARTER BLOCK: Bloomfield Ave to Court St
         Modelled buildings use `kit-building` (see js/landmarks.js).
         Plain shopfront blocks use `building` (see js/components.js).
         Position = centre of the building's front at ground level.
         West side: rotation="0 90 0".  East side: rotation="0 -90 0".
         ============================================================ -->

    <!-- West side (odd numbers), north to south -->
    <a-entity id="bldg-57-main" position="-11 0 -85.4" rotation="0 90 0"
      building="width: 16; height: 10; depth: 20; stories: 3; color: #8e4a36; wall: brick; bays: 5; photo: "></a-entity>
    <!-- Wurts Law Office (59 Main, c. 1811, Greek Revival portico c. 1840): Blender model
         with Poly Haven textures and baked late-afternoon light. Built by
         tools/blender/wurts_law_office.py + wurts_law_office_bake.py.
         Position = centre of the portico front (porch edge) at grade, 4.69 m behind the
         property line; the front step and cornice reach 0.3 m further east, to x -14.65.
         It stands on the lawn (y 0.02); its foundation skirt reaches below grade so it never
         floats. The old code-built version is still available as kit-building="type: law-office". -->
    <a-entity id="wurts-law-office" position="-14.95 0.02 -68.69" rotation="0 90 0"
      gltf-model="url(assets/models/wurts-law-office.glb)"
      baked-lighting="lightmap: assets/textures/wurts-law-office-lightmap.jpg; intensity: 1.1647"></a-entity>
    <!-- Frame dwelling at 65 Main (old no. 510, 2½ storeys, Sanborn "D"): Blender model with
         Poly Haven textures and baked late-afternoon light. Built by
         tools/blender/house_65_main.py + house_65_main_bake.py.
         Position = centre of the front porch edge at grade, 3.80 m behind the property line
         (front wall 5.81 m behind it); the porch steps reach 0.84 m further east, to x -13.23.
         It stands on the lawn (y 0.02); its foundation reaches below grade so it never floats.
         The old code-built version is still available as kit-building="type: house". -->
    <a-entity id="house-65-main" position="-14.07 0.02 -51.19" rotation="0 90 0"
      gltf-model="url(assets/models/house-65-main.glb)"
      baked-lighting="lightmap: assets/textures/house-65-main-lightmap.jpg; intensity: 1.274"></a-entity>
    <!-- Hunterdon County Offices / Hall of Records (69–71 Main, 1870): Blender model with
         Poly Haven textures and baked late-afternoon light. Built by
         tools/blender/county_offices.py + county_offices_bake.py.
         Position = centre of the front brick wall at grade (7.41 m behind the property line);
         the three stone stoops project 2.4 m further east, to x -15.3. It stands on the lawn
         (y 0.02); its stone foundation reaches 0.2 m below grade so it never floats. The old
         code-built version is still available as kit-building="type: county-offices". -->
    <a-entity id="county-offices" position="-17.71 0.02 -27.87" rotation="0 90 0"
      gltf-model="url(assets/models/county-offices.glb)"
      baked-lighting="lightmap: assets/textures/county-offices-lightmap.jpg; intensity: 1.1299"></a-entity>
    <!-- Hunterdon County Court House (75 Main): Blender model with Poly Haven textures and
         baked late-afternoon light. Built by tools/blender/courthouse.py + courthouse_bake.py.
         Position = centre of the portico front (8.0 m behind the property line); the
         brownstone steps project 1.65 m further east, to x -16.69. It stands on the paved
         forecourt at sidewalk height (y 0.15). The old code-built version is still
         available as kit-building="type: courthouse". -->
    <a-entity id="courthouse" position="-18.34 0.15 -6.85" rotation="0 90 0"
      gltf-model="url(assets/models/courthouse.glb)"
      baked-lighting="lightmap: assets/textures/courthouse-lightmap.jpg; intensity: 1.1979"></a-entity>
    <!-- Paved forecourt (1906–1912 photos: no lawn) from the sidewalk to the portico,
         flush with the sidewalk top (0.15) and out to the Court St line (z 0), and 15 cm grade slabs under the courthouse
         body, north wing and jail yard so the walls don't float above the lawn. -->
    <a-entity id="courthouse-grounds">
      <a-box id="courthouse-forecourt" position="-14.4 0.075 -6.775" width="8.2" height="0.15" depth="13.55"
        material="src: assets/textures/polyhaven/sidewalk_concrete.jpg; repeat: 2.7 4.5; roughness: 1"></a-box>
      <a-box position="-30.8 0.075 -6.775" width="24.9" height="0.15" depth="13.55"
        material="color: #8a8378; roughness: 1"></a-box>
      <a-box position="-27.36 0.075 -15.45" width="7.82" height="0.15" depth="3.8"
        material="color: #8a8378; roughness: 1"></a-box>
      <a-box position="-48.9 0.075 -7.8" width="11.3" height="0.15" depth="15.6"
        material="color: #8a8378; roughness: 1"></a-box>
    </a-entity>

    <!-- East side (even numbers), north to south -->
    <!-- Bank Building / Flemington National Bank (56–66 Main, 1897: bank, men's furnishings,
         drugs, shoes, confectionery): Blender model with Poly Haven textures and baked
         late-afternoon light. Built by tools/blender/bank_building.py + bank_building_bake.py.
         Position = centre of the front stone wall face at sidewalk level, 1.94 m behind the
         property line; the stoops project 1.8 m further west, to x 10.45. North wall on
         Bloomfield Ave at z -77.31, south wall at z -55.17 (against 68 Main). Its walls skirt
         0.2 m below the sidewalk top, so they meet the lower Bloomfield Ave grade without a gap. -->
    <a-entity id="bank-building" position="12.24 0.15 -66.24" rotation="0 -90 0"
      gltf-model="url(assets/models/bank-building.glb)"
      baked-lighting="lightmap: assets/textures/bank-building-lightmap.jpg; intensity: 1.1241"></a-entity>
    <!-- Paved strip between the sidewalk and the bank's front wall (x 10.30–12.28, flush with
         the sidewalk top 0.15) along its 22.14 m frontage; the stoops stand on it. -->
    <a-box id="bank-forecourt" position="11.29 0.075 -66.24" width="1.98" height="0.15" depth="22.14"
      material="src: assets/textures/polyhaven/sidewalk_concrete.jpg; repeat: 0.66 7.4; roughness: 1"></a-box>
    <!-- 68 Main: restaurant, pool room upstairs -->
    <a-entity id="bldg-68-main" position="10.6 0 -51.7" rotation="0 -90 0"
      building="width: 5.5; height: 7.5; depth: 18; stories: 2; color: #c7b48e; wall: wood; bays: 2; photo: "></a-entity>
    <!-- Union Hotel: Blender model with Poly Haven textures and baked late-afternoon light.
         Built by tools/blender/union_hotel.py + union_hotel_bake.py.
         The old code-built version is still available as kit-building="type: union-hotel". -->
    <a-entity id="union-hotel" position="11.6 0.15 -30.75" rotation="0 -90 0"
      gltf-model="url(assets/models/union-hotel.glb)"
      baked-lighting="lightmap: assets/textures/union-hotel-lightmap.jpg; intensity: 1.2646"></a-entity>

    <!-- ============================================================
         STREET TREES (tools/blender/street_tree.py → assets/models/street-tree.glb)
         1920s postcards show a row of trees at the curb in front of the Union Hotel.
         The west-side trees follow the 1906–1912 courthouse and county building views.
         Each model includes its square soil pit with granite edging (1.44 m, origin at the
         base, pit top at y = 0). The soil dips to y = −0.02, so the trees stand at y = 0.175
         (2.5 cm above the 0.15 sidewalk top) or the sidewalk hides the soil; the granite
         edging then stands ~3.5 cm proud of the paving, like a real curb. x = ±7.5 keeps
         the largest pit (scale 1.15 → half-width 0.83 m) clear of the curb (inner edge ±6.64).
         Rotations are multiples of 90° so the pits line up with the street; the scales
         vary so the trees don't look stamped.
         ============================================================ -->
    <a-entity id="street-trees">
      <a-entity id="tree-hotel-1" position="7.5 0.175 -44"   rotation="0 0 0"  scale="1.05 1.05 1.05" gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-hotel-2" position="7.5 0.175 -39.8" rotation="0 90 0" scale="0.92 0.95 0.92" gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-hotel-3" position="7.5 0.175 -35.6" rotation="0 180 0"  scale="1.1 1.08 1.1"   gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-hotel-4" position="7.5 0.175 -31.4" rotation="0 270 0" scale="0.97 1 0.97"    gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-hotel-5" position="7.5 0.175 -27.2" rotation="0 90 0" scale="1.02 0.94 1.02" gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-hotel-6" position="7.5 0.175 -23"   rotation="0 0 0" scale="0.9 0.9 0.9"    gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-hotel-7" position="7.5 0.175 -18.8" rotation="0 180 0"  scale="1.12 1.1 1.12"  gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-west-1"  position="-7.5 0.175 -2.6"  rotation="0 270 0" scale="0.85 0.88 0.85" gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-west-2"  position="-7.5 0.175 -11.5" rotation="0 0 0" scale="0.9 0.92 0.9"   gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-west-3"  position="-7.5 0.175 -24"   rotation="0 90 0"   scale="1.15 1.12 1.15" gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-west-4"  position="-7.5 0.175 -33"   rotation="0 180 0" scale="1.05 1.1 1.05"  gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
      <a-entity id="tree-west-5"  position="-7.5 0.175 -60"   rotation="0 270 0" scale="1 1 1"         gltf-model="url(assets/models/street-tree.glb)" foliage></a-entity>
    </a-entity>
    <!-- Nevius Store / Fulper's Dry Goods Building (78 Main, 3-storey brick Italianate store,
         front c. 1880): Blender model with Poly Haven textures and baked late-afternoon light.
         Built by tools/blender/nevius_store.py + nevius_store_bake.py.
         Position = centre of the front brick wall face at sidewalk level, on the property line.
         North wall z -11.33, south wall z -3.33, rear wall x 42.55; the striped awning reaches
         1.91 m over the sidewalk (bottom 2.45 m). Its walls skirt 0.2 m below the sidewalk top,
         so they meet the ground (y 0) in the side gaps without floating. -->
    <a-entity id="bldg-78-main" position="10.3 0.15 -7.33" rotation="0 -90 0"
      gltf-model="url(assets/models/nevius-store.glb)"
      baked-lighting="lightmap: assets/textures/nevius-store-lightmap.jpg; intensity: 1.1072"></a-entity>

    <!-- ============================================================
         BEYOND THE STARTER BLOCK: simple placeholders.
         East-side widths and storeys follow the map; the rest are rough.
         ============================================================ -->

    <!-- North of Bloomfield Ave, east side -->
    <a-entity id="bldg-48-52-main" position="10.3 0 -98.3" rotation="0 -90 0"
      building="width: 15.7; height: 11; depth: 14; stories: 3; color: #7a3b2e; wall: brick; photo: "></a-entity>
    <a-entity id="bldg-40-46-main" position="10.3 0 -115.8" rotation="0 -90 0"
      building="width: 16; height: 7.5; depth: 12; stories: 2; color: #bfa77c; wall: wood; photo: "></a-entity>
    <a-entity id="bldg-32-38-main" position="10.3 0 -130.7" rotation="0 -90 0"
      building="width: 13.8; height: 7.5; depth: 12; stories: 2; color: #c8b48a; wall: wood; photo: "></a-entity>
    <a-entity id="bldg-24-30-main" position="10.3 0 -149.1" rotation="0 -90 0"
      building="width: 16.4; height: 7.5; depth: 12; stories: 2; color: #b59a72; wall: wood; photo: "></a-entity>

    <!-- North of the starter block, west side -->
    <a-entity id="county-hotel" position="-10.3 0 -111.8" rotation="0 90 0"
      building="width: 24; height: 10.5; depth: 16; stories: 3; color: #d8ccb0; wall: wood; photo: "></a-entity>
    <a-entity id="bldg-35-41-main" position="-10.3 0 -129.6" rotation="0 90 0"
      building="width: 12; height: 7; depth: 12; stories: 2; color: #b8a07a; wall: wood; photo: "></a-entity>
    <a-entity id="palace-theatre" position="-10.3 0 -145.7" rotation="0 90 0"
      building="width: 12.7; height: 9; depth: 30; stories: 2; color: #7b4030; wall: brick; photo: "></a-entity>
    <a-entity id="bldg-27-main" position="-10.3 0 -159.5" rotation="0 90 0"
      building="width: 10.4; height: 9; depth: 20; stories: 2; color: #8f4c3a; wall: brick; photo: "></a-entity>

    <!-- South of Court St, east side (sheet 3) -->
    <a-entity id="bldg-82-84-main" position="10.3 0 7.7" rotation="0 -90 0"
      building="width: 15.6; height: 10.7; depth: 14; stories: 3; color: #9c5b45; wall: brick; photo: "></a-entity>
    <a-entity id="bldg-90-94-main" position="10.3 0 29.1" rotation="0 -90 0"
      building="width: 20.8; height: 11.5; depth: 15; stories: 3; color: #8a4a38; wall: brick; photo: "></a-entity>
    <a-entity id="bldg-96-98-main" position="10.3 0 42.8" rotation="0 -90 0"
      building="width: 4.8; height: 7; depth: 12; stories: 2; color: #c2ad84; wall: wood; photo: "></a-entity>
    <a-entity id="bldg-100-102-main" position="10.3 0 50.05" rotation="0 -90 0"
      building="width: 9.7; height: 10; depth: 14; stories: 3; color: #a0604a; wall: brick; photo: "></a-entity>
    <a-entity id="bldg-106-main" position="10.3 0 57.65" rotation="0 -90 0"
      building="width: 5.5; height: 10; depth: 12; stories: 3; color: #b8a07a; wall: wood; photo: "></a-entity>

    <!-- South of Court St, west side: houses (positions and styles are guesses) -->
    <a-entity id="house-w-s1" position="-16 0 22" rotation="0 90 0"
      kit-building="type: house; width: 9; depth: 11; stories: 2; color: #e8e1cf"></a-entity>
    <a-entity id="house-w-s2" position="-16 0 38" rotation="0 90 0"
      kit-building="type: house; width: 8; depth: 11; stories: 2; color: #d9cdb0; trim: #f3ecdc"></a-entity>
    <a-entity id="house-w-s3" position="-16 0 54" rotation="0 90 0"
      kit-building="type: house; width: 9; depth: 12; stories: 2; color: #e6dfd0; porchWidth: 6; porchX: -1.2"></a-entity>

    <!-- ============================================================
         PLAYER RIG
         The rig is moved by `locomotion`. The camera and both hands are children,
         so everything moves together. Start just south of the courthouse,
         facing north, with the courthouse ahead-left and the Union Hotel ahead-right.
         ============================================================ -->
    <!-- Rig y = 0.15 raises the viewer 15 cm (sidewalk height), in VR and on desktop. -->
    <a-entity id="rig" position="0 0.15 18" locomotion="speed: 2; snapAngle: 45">
      <!-- 1.6 m eye height on desktop (1.75 m with the rig offset); in VR the headset
           supplies the real height, plus the rig's 0.15 m. -->
      <!-- stick-debug: temporary VR readout of thumbstick values. Delete it to remove. -->
      <a-entity id="camera" camera position="0 1.6 0"
        look-controls="pointerLockEnabled: true" stick-debug></a-entity>
      <!-- Quest 2 Touch controllers. A-Frame 1.6.0 calls these oculus-touch-controls
           (the newer name meta-touch-controls does not exist in this version). -->
      <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
      <a-entity id="right-hand" oculus-touch-controls="hand: right"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
